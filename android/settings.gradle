pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.3.0" apply false
    id "org.jetbrains.kotlin.android" version "2.4.20" apply false
    id "com.google.gms.google-services" version "4.5.0" apply false
}

include ":app"

// Gradle 9+ removed the jcenter() repository method.
// Auto-patch any legacy plugin that still invokes jcenter() in its build.gradle.
rootProject.children.each { projectDescriptor ->
    def buildFile = new File(projectDescriptor.projectDir, "build.gradle")
    if (buildFile.exists()) {
        def text = buildFile.text
        if (text.contains("jcenter()")) {
            println "[Gradle 9 Compatibility] Patching deprecated jcenter() in ${projectDescriptor.name}"
            buildFile.text = text.replaceAll(/(?m)^\s*jcenter\(\)\s*$/, '// jcenter()')
        }
    }
}

